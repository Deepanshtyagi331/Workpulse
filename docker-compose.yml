services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workpulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=WorkPulse
      - PROJECT_TAGLINE=Internal Task & Management Dashboard
      - VERSION=0.1.0
      - DEBUG=False
      - API_V1_STR=/api/v1
      - DATABASE_URL=sqlite:////app/data/workpulse.db
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80,http://localhost:5173
      - EXTERNAL_API_BASE_URL=https://jsonplaceholder.typicode.com
      - EXTERNAL_API_TIMEOUT_SECONDS=10
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-workpulse-dev-secret-key-change-in-production-use-256-bit-random}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=480
      - MAX_UPLOAD_SIZE_MB=10
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - workpulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: workpulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - workpulse-net

volumes:
  backend-data:
    name: workpulse_backend_data
  backend-uploads:
    name: workpulse_backend_uploads

networks:
  workpulse-net:
    name: workpulse_network
    driver: bridge
